<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		<title>Magnetic Field Simulator</title>
		<script>
			(function () {
				var t = null;
				try {
					t = localStorage.getItem("mf-theme");
				} catch (e) {}
				if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				document.documentElement.dataset.theme = t;
			})();
		</script>
		<style type="text/css">
			:root {
				--bg: #eceff3;
				--panel: #fff;
				--text: #18202c;
				--muted: #5d6879;
				--border: #d6dce5;
				--accent: #2563eb;
				--c-bg: #f6f3ea;
				--c-fil: #222a36;
				--c-line: #26334a;
				--c-earth: #d97706;
				--c-trace: #0891b2;
				--c-null: #9333ea;
				--c-north: #d9433b;
				--c-south: #3b6fd6;
				--c-ink: #27303d;
				--c-text: #27303d;
				--c-bezel: #b9c0cc;
				--c-face: #faf8f2;
				--c-needleS: #e9edf3;
				--c-pill: rgba(255, 255, 255, 0.88);
			}
			:root[data-theme="dark"] {
				--bg: #0d1016;
				--panel: #171b23;
				--text: #e6e9ef;
				--muted: #98a2b3;
				--border: #2a303c;
				--accent: #5b9cff;
				--c-bg: #0e1218;
				--c-fil: #d6dbe6;
				--c-line: #a9b6d0;
				--c-earth: #f59e0b;
				--c-trace: #22d3ee;
				--c-null: #c084fc;
				--c-north: #e5534b;
				--c-south: #4f83ea;
				--c-ink: #dfe4ee;
				--c-text: #dfe4ee;
				--c-bezel: #4a5361;
				--c-face: #1b212b;
				--c-needleS: #cfd6e2;
				--c-pill: rgba(23, 27, 35, 0.88);
			}
			* {
				box-sizing: border-box;
			}
			[hidden] {
				display: none !important;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				font:
					14px/1.4 system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					sans-serif;
				background: var(--bg);
				color: var(--text);
			}
			.app {
				display: grid;
				grid-template-columns: 1fr 330px;
				height: 100vh;
				height: 100dvh;
			}
			.stage {
				position: relative;
				min-width: 0;
				min-height: 0;
				overflow: hidden;
				background: var(--c-bg);
			}
			#view {
				position: absolute;
				inset: 0;
				display: block;
				touch-action: none;
			}
			.busy,
			.toast {
				position: absolute;
				left: 12px;
				font-size: 12px;
				padding: 5px 10px;
				border-radius: 999px;
				background: var(--c-pill);
				color: var(--c-text);
				border: 1px solid var(--border);
				pointer-events: none;
			}
			.busy {
				top: 12px;
				display: none;
			}
			.toast {
				bottom: 12px;
				opacity: 0;
				transition: opacity 0.25s;
				max-width: calc(100% - 24px);
			}
			.toast.show {
				opacity: 1;
			}
			.panel {
				overflow: auto;
				background: var(--panel);
				border-left: 1px solid var(--border);
				padding: 14px 16px 28px;
			}
			header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				margin-bottom: 6px;
			}
			h1 {
				font-size: 16px;
				margin: 0;
			}
			h2 {
				font-size: 11px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--muted);
				margin: 0 0 8px;
			}
			section {
				padding: 12px 0;
				border-top: 1px solid var(--border);
			}
			section:first-of-type {
				border-top: 0;
			}
			.hbtns {
				display: flex;
				gap: 6px;
			}
			button {
				font: inherit;
				color: var(--text);
				background: transparent;
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 5px 12px;
				cursor: pointer;
			}
			button:hover {
				border-color: var(--accent);
			}
			button.icon {
				width: 34px;
				padding: 5px 0;
				font-size: 16px;
				line-height: 1;
			}
			button.wide {
				width: 100%;
				margin-top: 8px;
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
			button.wide:hover {
				filter: brightness(1.1);
			}
			.row {
				display: grid;
				grid-template-columns: 82px 1fr 64px;
				align-items: center;
				gap: 8px;
				margin: 6px 0;
			}
			.row output {
				text-align: right;
				font-variant-numeric: tabular-nums;
				color: var(--muted);
				font-size: 12px;
			}
			.chk {
				display: flex;
				align-items: center;
				gap: 8px;
				margin: 7px 0;
				cursor: pointer;
			}
			input[type="range"] {
				width: 100%;
				accent-color: var(--accent);
			}
			input:disabled,
			input:disabled + * {
				opacity: 0.45;
			}
			.seg {
				display: grid;
				grid-template-columns: 1fr 1fr;
				border: 1px solid var(--border);
				border-radius: 8px;
				overflow: hidden;
				margin-bottom: 8px;
			}
			.seg input {
				position: absolute;
				opacity: 0;
				pointer-events: none;
			}
			.seg label {
				text-align: center;
				padding: 6px 0;
				cursor: pointer;
				color: var(--muted);
			}
			.seg input:checked + label {
				background: var(--accent);
				color: #fff;
			}
			.seg input:focus-visible + label {
				outline: 2px solid var(--accent);
				outline-offset: -2px;
			}
			@media (max-width: 820px) {
				.app {
					grid-template-columns: 1fr;
					grid-template-rows: 64vh auto;
					height: auto;
					min-height: 100vh;
				}
				.panel {
					border-left: 0;
					border-top: 1px solid var(--border);
				}
			}
		</style>
	</head>
	<body>
		<div class="app">
			<main class="stage" id="stage">
				<canvas id="view"></canvas>
				<div class="busy" id="busy">Tracing field lines…</div>
				<div class="toast" id="toast" role="status" aria-live="polite"></div>
			</main>
			<aside class="panel">
				<header>
					<h1>Magnetic Field Simulator</h1>
					<div class="hbtns">
						<button id="themeBtn" class="icon" title="Toggle light / dark mode" aria-label="Toggle light or dark mode"></button>
						<button id="resetBtn" title="Restore all settings">Reset</button>
					</div>
				</header>
				<section>
					<h2>Show field with</h2>
					<div class="seg"><input type="radio" name="mode" id="mode_filings" value="filings"/><label for="mode_filings">Iron filings</label> <input type="radio" name="mode" id="mode_lines" value="lines"/><label for="mode_lines">Flux lines</label></div>
					<div id="grpFil">
						<label class="row"><span>Density</span><input type="range" id="filDensity" min="5" max="100" step="1"/><output id="o_filDensity"></output></label>
						<label class="row"><span>Grain size</span><input type="range" id="grain" min="2" max="12" step="0.5"/><output id="o_grain"></output></label>
						<button id="sprinkleBtn" class="wide">Sprinkle fresh filings</button>
					</div>
					<div id="grpLines">
						<label class="row"><span>Line density</span><input type="range" id="lineDensity" min="20" max="260" step="5"/><output id="o_lineDensity"></output></label>
						<label class="chk"><input type="checkbox" id="arrows"/> Show direction arrows</label>
						<label class="chk"><input type="checkbox" id="earthColor"/> Earth's lines in a different colour</label>
					</div>
				</section>
				<section>
					<h2>Magnet</h2>
					<label class="row"><span>Strength</span><input type="range" id="strength" min="10" max="300" step="5"/><output id="o_strength"></output></label>
					<label class="row"><span>Size</span><input type="range" id="size" min="50" max="170" step="5"/><output id="o_size"></output></label>
					<label class="row"><span>North pole</span><input type="range" id="dir" min="0" max="359" step="1"/><output id="o_dir"></output></label>
				</section>
				<section>
					<h2>Earth's field</h2>
					<label class="chk"><input type="checkbox" id="earthOn"/> Enable (points North, up the screen)</label>
					<label class="row"><span>Strength</span><input type="range" id="earth" min="0" max="150" step="1"/><output id="o_earth"></output></label>
				</section>
				<section>
					<h2>Compass</h2>
					<label class="chk"><input type="checkbox" id="compassOn"/> Show compass (drag it anywhere)</label>
					<label class="row"><span>Size</span><input type="range" id="compassSize" min="28" max="90" step="1"/><output id="o_compassSize"></output></label>
					<label class="chk"><input type="checkbox" id="trace"/> Trace field line through compass</label>
					<button id="nullBtn" class="wide">Jump to nearest null point</button>
				</section>
			</aside>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
		<script>
			window.Matter || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"><\/script>');
		</script>
		<script>
			(() => {
				"use strict";
				const $ = id => document.getElementById(id);
				const busy = $("busy");
				if (!window.Matter) {
					busy.textContent = "Matter.js failed to load – check your connection.";
					busy.style.display = "block";
					return;
				}
				const { Engine, Bodies, Body, Composite } = Matter;
				/* ================= constants & settings ================= */
				const TAU = Math.PI * 2,
					DT = 1000 / 60,
					DT2 = DT * DT;
				const BASE_L = 220,
					ASPECT = 0.26,
					SIGMA0 = 1,
					EARTH_K = 0.004,
					EPS2 = 0.25;
				const PHI_REF = Math.PI * SIGMA0 * BASE_L * ASPECT; // flux leaving one pole face at defaults
				const LEVEL_OFFSET = 0.3719,
					MAX_LINES = 1200,
					NULL_H = 0.015;
				const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
				const DEFAULTS = {
					mode: "filings",
					filDensity: 45,
					grain: 5,
					lineDensity: 90,
					arrows: true,
					earthColor: true,
					strength: 100,
					size: 100,
					dir: 0,
					earthOn: true,
					earth: 50,
					compassOn: true,
					compassSize: 46,
					trace: true
				};
				const S = { ...DEFAULTS };
				const RANGES = ["filDensity", "grain", "lineDensity", "strength", "size", "dir", "earth", "compassSize"];
				const CHECKS = ["arrows", "earthColor", "earthOn", "compassOn", "trace"];
				const PTS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
				const FMT = {
					filDensity: v => v + "%",
					grain: v => (+v).toFixed(1) + " px",
					lineDensity: v => v,
					strength: v => v + "%",
					size: v => v + "%",
					dir: v => v + "° " + PTS[Math.round(v / 45) % 8],
					earth: v => v + " µT",
					compassSize: v => v + " px"
				};
				let W = 800,
					H = 600,
					dpr = 1;
				const dirty = { lines: true, nulls: true, seps: true, trace: true };
				/* ================= theme ================= */
				const mq = matchMedia("(prefers-color-scheme: dark)");
				const COL = {};
				const getStored = () => {
					try {
						return localStorage.getItem("mf-theme");
					} catch (e) {
						return null;
					}
				};
				function readColors() {
					const cs = getComputedStyle(document.documentElement);
					for (const k of ["bg", "fil", "line", "earth", "trace", "null", "north", "south", "ink", "text", "bezel", "face", "needleS", "pill"]) COL[k] = cs.getPropertyValue("--c-" + k).trim();
				}
				function applyTheme(t) {
					document.documentElement.dataset.theme = t;
					$("themeBtn").textContent = t === "dark" ? "☀" : "☾";
					readColors();
					dirty.lines = true;
				}
				$("themeBtn").onclick = () => {
					const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
					try {
						localStorage.setItem("mf-theme", t);
					} catch (e) {}
					applyTheme(t);
				};
				mq.addEventListener("change", e => {
					if (!getStored()) applyTheme(e.matches ? "dark" : "light");
				});
				/* ================= magnet + Earth field model =================
					2-D uniformly magnetised bar: two oppositely charged pole faces (±σ).
					Closed-form B and stream function A (B = (∂A/∂y, −∂A/∂x)); Earth adds a uniform field pointing up. */
				const M = { cx: 0, cy: 0, ux: 1, uy: 0, vx: 0, vy: 1, hl: 110, hw: 28, sigma: 1, E: 0, ex: 0, ey: 0 };
				function updateGeometry() {
					M.cx = W / 2;
					M.cy = H / 2;
					const b = (S.dir * Math.PI) / 180;
					M.ux = Math.sin(b);
					M.uy = -Math.cos(b);
					M.vx = -M.uy;
					M.vy = M.ux; // u = south→north axis
					const L = (BASE_L * S.size) / 100;
					M.hl = L / 2;
					M.hw = (L * ASPECT) / 2;
					M.sigma = (SIGMA0 * S.strength) / 100;
					M.E = S.earthOn ? S.earth * EARTH_K : 0;
					M.ex = 0;
					M.ey = -M.E;
				}
				let FX = 0,
					FY = 0,
					FA = 0,
					LX = 0,
					LY = 0; // outputs of field()
				function field(px, py, needA) {
					const dx = px - M.cx,
						dy = py - M.cy;
					const xl = dx * M.ux + dy * M.uy,
						yl = dx * M.vx + dy * M.vy;
					LX = xl;
					LY = yl;
					const Xa = xl - M.hl,
						Xb = xl + M.hl,
						t2 = yl + M.hw,
						t1 = yl - M.hw;
					const a2a = Math.atan2(t2, Xa),
						a2b = Math.atan2(t2, Xb),
						a1a = Math.atan2(t1, Xa),
						a1b = Math.atan2(t1, Xb);
					const Xa2 = Xa * Xa,
						Xb2 = Xb * Xb,
						t22 = t2 * t2,
						t12 = t1 * t1;
					const l2a = Math.log(Xa2 + t22 + EPS2),
						l2b = Math.log(Xb2 + t22 + EPS2);
					const l1a = Math.log(Xa2 + t12 + EPS2),
						l1b = Math.log(Xb2 + t12 + EPS2);
					const s = M.sigma;
					let bx = s * (a2a - a2b - (a1a - a1b));
					const by = 0.5 * s * (l2a - l2b - (l1a - l1b));
					if (xl > -M.hl && xl < M.hl && yl > -M.hw && yl < M.hw) bx -= TAU * s; // field "above" the bar (H-like)
					FX = bx * M.ux + by * M.vx + M.ex;
					FY = bx * M.uy + by * M.vy + M.ey;
					if (needA) {
						const g = (t, X, a, l) => t * a - 0.5 * X * l;
						FA = s * (g(t2, Xa, a2a, l2a) - g(t2, Xb, a2b, l2b) - (g(t1, Xa, a1a, l1a) - g(t1, Xb, a1b, l1b))) + (M.ex * py - M.ey * px);
					}
				}
				function jac(x, y) {
					const h = 0.3;
					field(x + h, y, false);
					const a1 = FX,
						c1 = FY;
					field(x - h, y, false);
					const a2 = FX,
						c2 = FY;
					field(x, y + h, false);
					const b1 = FX,
						d1 = FY;
					field(x, y - h, false);
					const b2 = FX,
						d2 = FY;
					return [(a1 - a2) / (2 * h), (b1 - b2) / (2 * h), (c1 - c2) / (2 * h), (d1 - d2) / (2 * h)];
				}
				/* ================= null points (Newton) + separatrices ================= */
				let nulls = [];
				function findNulls() {
					nulls = [];
					if (M.E < 1e-6) return;
					const found = [],
						nx = 26,
						ny = 18;
					for (let i = 0; i < nx; i++)
						for (let j = 0; j < ny; j++) {
							let x = ((i + 0.5) / nx) * W,
								y = ((j + 0.5) / ny) * H,
								ok = false;
							for (let it = 0; it < 40; it++) {
								field(x, y, false);
								const bx = FX,
									by = FY,
									J = jac(x, y);
								const det = J[0] * J[3] - J[1] * J[2];
								if (Math.abs(det) < 1e-12) break;
								let dx = -(J[3] * bx - J[1] * by) / det,
									dy = -(-J[2] * bx + J[0] * by) / det;
								const st = Math.hypot(dx, dy);
								if (st > 30) {
									dx *= 30 / st;
									dy *= 30 / st;
								}
								x += dx;
								y += dy;
								if (x < -0.2 * W || x > 1.2 * W || y < -0.2 * H || y > 1.2 * H) break;
								if (st < 1e-4) {
									ok = true;
									break;
								}
							}
							if (!ok) continue;
							field(x, y, false);
							if (Math.hypot(FX, FY) > 1e-3 * M.E) continue;
							if (x < 8 || x > W - 8 || y < 8 || y > H - 8) continue;
							if (Math.abs(LX) < M.hl + 2 && Math.abs(LY) < M.hw + 2) continue;
							if (found.some(p => Math.hypot(p.x - x, p.y - y) < 3)) continue;
							found.push({ x, y, sep: null });
						}
					nulls = found;
				}
				function computeSeps() {
					for (const n of nulls) {
						n.sep = [];
						const J = jac(n.x, n.y),
							a = J[0],
							d = J[3],
							b = (J[1] + J[2]) / 2;
						const m = (a + d) / 2,
							r = Math.hypot((a - d) / 2, b);
						if (!(m + r > 0 && m - r < 0)) continue; // saddle (X-point) expected
						const th = 0.5 * Math.atan2(2 * b, a - d),
							ex = Math.cos(th),
							ey = Math.sin(th);
						const dirs = [
							[ex, ey, 2],
							[-ex, -ey, 2],
							[-ey, ex, -2],
							[ey, -ex, -2]
						]; // out along e+, in along e−
						for (const [dx, dy, h] of dirs) {
							const cnt = trace(n.x + dx * 2, n.y + dy * 2, h, false, 1500);
							const arr = new Float32Array(cnt * 2);
							for (let i = 0; i < cnt; i++) {
								arr[2 * i] = PX[i];
								arr[2 * i + 1] = PY[i];
							}
							n.sep.push(arr);
						}
					}
				}
				/* ================= field-line tracing (RK4 on the unit field) ================= */
				const PX = new Float32Array(12000),
					PY = new Float32Array(12000);
				let DX = 0,
					DY = 0;
				function dirAt(x, y) {
					field(x, y, false);
					const m = Math.sqrt(FX * FX + FY * FY);
					if (m < 1e-9) {
						DX = DY = 0;
						return 0;
					}
					DX = FX / m;
					DY = FY / m;
					return m;
				}
				function trace(x, y, h, startIn, maxSteps) {
					let n = 0;
					PX[n] = x;
					PY[n] = y;
					n++;
					for (let s = 0; s < maxSteps && n < PX.length; s++) {
						if (dirAt(x, y) < 1e-7) break;
						const k1x = DX,
							k1y = DY;
						dirAt(x + 0.5 * h * k1x, y + 0.5 * h * k1y);
						const k2x = DX,
							k2y = DY;
						dirAt(x + 0.5 * h * k2x, y + 0.5 * h * k2y);
						const k3x = DX,
							k3y = DY;
						dirAt(x + h * k3x, y + h * k3y);
						const k4x = DX,
							k4y = DY;
						x += (h * (k1x + 2 * k2x + 2 * k3x + k4x)) / 6;
						y += (h * (k1y + 2 * k2y + 2 * k3y + k4y)) / 6;
						PX[n] = x;
						PY[n] = y;
						n++;
						if (x < -3 || x > W + 3 || y < -3 || y > H + 3) break;
						const dx = x - M.cx,
							dy = y - M.cy;
						const ins = Math.abs(dx * M.ux + dy * M.uy) < M.hl && Math.abs(dx * M.vx + dy * M.vy) < M.hw;
						if (ins !== startIn) break;
					}
					return n;
				}
				/* ================= flux lines: equal-flux seeding on stream-function levels ================= */
				const lf = document.createElement("canvas"),
					lb = document.createElement("canvas");
				let lfc = lf,
					lbc = lb,
					job = null,
					budgetEnd = 0;

						ctx.beginPath();
						ctx.moveTo(R + 15, 0);
						ctx.lineTo(R + 5, -5);
						ctx.lineTo(R + 5, 5);
						ctx.closePath();
						ctx.fill();
						ctx.restore();
					}
					ctx.restore();
					// readout pill
					const uT = comp.h / EARTH_K,
						bearing = ((Math.atan2(Math.cos(needle.angle), -Math.sin(needle.angle)) * 180) / Math.PI + 360) % 360;
					const txt = comp.isNull ? "NULL POINT" : (uT >= 1000 ? (uT / 1000).toFixed(2) + " mT" : uT.toFixed(0) + " µT") + "  ·  " + bearing.toFixed(0) + "°";
					ctx.font = "600 12px system-ui,sans-serif";
					ctx.textAlign = "center";
					ctx.textBaseline = "middle";
					const tw = ctx.measureText(txt).width + 16,
						py = Math.min(H - 14, comp.y + R + 20);
					ctx.fillStyle = COL.pill;
					rrect(ctx, comp.x - tw / 2, py - 10, tw, 20, 10);
					ctx.fill();
					ctx.fillStyle = comp.isNull ? COL.null : COL.text;
					ctx.fillText(txt, comp.x, py);
				}
				function draw(now) {
					ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
					ctx.fillStyle = COL.bg;
					ctx.fillRect(0, 0, W, H);
					if (S.mode === "filings") drawFilings();
					else {
						ctx.drawImage(lfc, 0, 0, W, H);
						drawNulls(now);
					}
					drawTrace();
					drawMagnet();
					drawEarthLegend();
					if (S.compassOn) drawCompass(now);
				}
				/* ================= UI wiring ================= */
				function showGroups() {
					$("grpFil").hidden = S.mode !== "filings";
					$("grpLines").hidden = S.mode !== "lines";
				}
				function syncUI() {
					for (const k of RANGES) {
						$(k).value = S[k];
						$("o_" + k).textContent = FMT[k](S[k]);
					}
					for (const k of CHECKS) $(k).checked = S[k];
					$("mode_" + S.mode).checked = true;
					showGroups();
					$("earth").disabled = !S.earthOn;
					$("earthColor").disabled = !S.earthOn;
					$("compassSize").disabled = !S.compassOn;
					$("trace").disabled = !S.compassOn;
				}
				function geometryChanged() {
					updateGeometry();
					dirty.lines = dirty.nulls = dirty.seps = dirty.trace = true;
				}
				function onChange(k) {
					$("earth").disabled = !S.earthOn;
					$("earthColor").disabled = !S.earthOn;
					$("compassSize").disabled = !S.compassOn;
					$("trace").disabled = !S.compassOn;
					if (k === "mode") {
						showGroups();
						dirty.lines = true;
					} else if (k === "filDensity") syncFilings();
					else if (k === "lineDensity" || k === "arrows" || k === "earthColor") dirty.lines = true;
					else if (["strength", "size", "dir", "earthOn", "earth"].includes(k)) geometryChanged();
					else if (k === "compassSize") comp.r = S.compassSize;
					else if (k === "compassOn" || k === "trace") dirty.trace = true;
				}
				for (const k of RANGES)
					$(k).addEventListener("input", e => {
						S[k] = +e.target.value;
						$("o_" + k).textContent = FMT[k](S[k]);
						onChange(k);
					});
				for (const k of CHECKS)
					$(k).addEventListener("change", e => {
						S[k] = e.target.checked;
						onChange(k);
					});
				document.querySelectorAll("input[name=mode]").forEach(r =>
					r.addEventListener("change", e => {
						S.mode = e.target.value;
						onChange("mode");
					})
				);
				$("sprinkleBtn").onclick = sprinkle;
				$("nullBtn").onclick = jumpNull;
				$("resetBtn").onclick = () => {
					Object.assign(S, DEFAULTS);
					try {
						localStorage.removeItem("mf-theme");
					} catch (e) {}
					applyTheme(mq.matches ? "dark" : "light");
					syncUI();
					comp.r = S.compassSize;
					geometryChanged();
					syncFilings();
					sprinkle();
					placeCompass();
				};
				/* compass dragging */
				let drag = null;
				const ptr = e => {
					const r = view.getBoundingClientRect();
					return { x: e.clientX - r.left, y: e.clientY - r.top };
				};
				view.addEventListener("pointerdown", e => {
					if (!S.compassOn) return;
					const p = ptr(e);
					if (Math.hypot(p.x - comp.x, p.y - comp.y) <= comp.r + 6) {
						drag = { dx: comp.x - p.x, dy: comp.y - p.y };
						glide = null;
						view.setPointerCapture(e.pointerId);
						view.style.cursor = "grabbing";
						e.preventDefault();
					}
				});
				view.addEventListener("pointermove", e => {
					const p = ptr(e);
					if (drag) {
						comp.x = clamp(p.x + drag.dx, 0, W);
						comp.y = clamp(p.y + drag.dy, 0, H);
						dirty.trace = true;
					} else view.style.cursor = S.compassOn && Math.hypot(p.x - comp.x, p.y - comp.y) <= comp.r + 6 ? "grab" : "default";
				});
				const endDrag = () => {
					drag = null;
					view.style.cursor = "default";
				};
				view.addEventListener("pointerup", endDrag);
				view.addEventListener("pointercancel", endDrag);
				/* ================= main loop ================= */
				let last = 0,
					acc = 0;
				function frame(now) {
					requestAnimationFrame(frame);
					if (!last) last = now;
					acc += Math.min(now - last, 50);
					last = now;
					if (dirty.nulls) {
						findNulls();
						dirty.nulls = false;
						dirty.seps = true;
					} else if (dirty.seps && S.mode === "lines") {
						computeSeps();
						dirty.seps = false;
					}
					if (S.mode === "lines") {
						if (dirty.lines) {
							job = linesGen();
							dirty.lines = false;
							busy.style.display = "block";
						}
						pumpLines(7);
					} else if (job) {
						job = null;
						busy.style.display = "none";
						dirty.lines = true;
					}
					if (glide) {
						const t = Math.min(1, (now - glide.t0) / 450),
							e = 1 - Math.pow(1 - t, 3);
						comp.x = glide.x0 + (glide.x1 - glide.x0) * e;
						comp.y = glide.y0 + (glide.y1 - glide.y0) * e;
						dirty.trace = true;
						if (t >= 1) glide = null;
					}
					if (dirty.trace) {
						computeTrace();
						dirty.trace = false;
					}
					for (let n = 0; acc >= DT && n < 2; n++, acc -= DT) {
						if (S.mode === "filings") {
							stepFilings();
							Engine.update(filEngine, DT);
						}
						stepCompass();
					}
					if (acc > DT) acc = 0;
					draw(now);
				}
				function resize() {
					const r = $("stage").getBoundingClientRect();
					W = Math.max(320, Math.round(r.width));
					H = Math.max(280, Math.round(r.height));
					dpr = Math.min(window.devicePixelRatio || 1, 2);
					for (const c of [view, lf, lb]) {
						c.width = Math.round(W * dpr);
						c.height = Math.round(H * dpr);
					}
					view.style.width = W + "px";
					view.style.height = H + "px";
					updateGeometry();
					comp.x = clamp(comp.x, comp.r, W - comp.r);
					comp.y = clamp(comp.y, comp.r, H - comp.r);
					job = null;
					dirty.lines = dirty.nulls = dirty.seps = dirty.trace = true;
					if (fil.length) syncFilings();
				}
				/* ================= start ================= */
				applyTheme(document.documentElement.dataset.theme || (mq.matches ? "dark" : "light"));
				syncUI();
				comp.r = S.compassSize;
				resize();
				placeCompass();
				syncFilings();
				new ResizeObserver(resize).observe($("stage"));
				requestAnimationFrame(frame);
			})();
		</script>
	</body>
</html>
