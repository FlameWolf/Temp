<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style type="text/css">
			* {
				box-sizing: border-box;
			}
			body {
				background-color: color-mix(in srgb, black 87.5%, darkgrey);
				color: lightgrey;
				font-family: sans-serif;
				padding: 0;
				margin: 0;
			}
			.container {
				display: flex;
				place-items: center;
				place-content: center;
				width: 100vw;
				height: 100vh;
			}
			.star {
				width: 25cqw;
				aspect-ratio: 1;
				background: repeating-conic-gradient(gold 0 10%, color-mix(in srgb, gold 75%, red) 10% 20%);
				clip-path: polygon(50% 0, calc(50% * (1 + sin(0.4turn))) calc(50% * (1 - cos(0.4turn))), calc(50% * (1 - sin(0.2turn))) calc(50% * (1 - cos(0.2turn))), calc(50% * (1 + sin(0.2turn))) calc(50% * (1 - cos(0.2turn))), calc(50% * (1 - sin(0.4turn))) calc(50% * (1 - cos(0.4turn))));
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="star"></div>
		</div>
	</body>
</html>
