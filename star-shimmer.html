<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style type="text/css">
			:root {
				--outline-colour: goldenrod;
				--outline-filter: drop-shadow(1pt 0 0 var(--outline-colour)) drop-shadow(-1pt 0 0 var(--outline-colour)) drop-shadow(0 1pt 0 var(--outline-colour)) drop-shadow(0 -1pt 0 var(--outline-colour));
				--shimmer-loop: 2s ease-in-out infinite;
			}
			* {
				box-sizing: border-box;
			}
			body {
				background-color: color-mix(in srgb, black 87.5%, darkgrey);
				color: lightgrey;
				font-family: sans-serif;
				padding: 0;
				margin: 0;
			}
			.container {
				display: flex;
				place-items: center;
				place-content: center;
				width: 100vw;
				height: 100vh;
			}
			.shimmer-wrapper {
				animation: shimmer var(--shimmer-loop);
			}
			.star {
				width: 25cqw;
				aspect-ratio: 1;
				clip-path: polygon(50% 0, calc(50% * (1 + sin(0.4turn))) calc(50% * (1 - cos(0.4turn))), calc(50% * (1 - sin(0.2turn))) calc(50% * (1 - cos(0.2turn))), calc(50% * (1 + sin(0.2turn))) calc(50% * (1 - cos(0.2turn))), calc(50% * (1 - sin(0.4turn))) calc(50% * (1 - cos(0.4turn))));
				animation: chroma var(--shimmer-loop);
			}
			@keyframes chroma {
				0%,
				100% {
					background: gold;
				}
				50% {
					background: color-mix(in srgb, gold 75%, white);
				}
			}
			@keyframes shimmer {
				0%,
				100% {
					filter: drop-shadow(0 0 1rem orange);
				}
				50% {
					filter: drop-shadow(0 0 2rem darkred) var(--outline-filter);
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="shimmer-wrapper">
				<div class="star"></div>
			</div>
		</div>
	</body>
</html>
