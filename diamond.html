<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style type="text/css">
			* {
				box-sizing: border-box;
			}
			body {
				background-color: color-mix(in srgb, black 87.5%, darkgrey);
				color: lightgrey;
				font-family: sans-serif;
				padding: 0;
				margin: 0;
			}
			.container {
				display: flex;
				place-items: center;
				place-content: center;
				width: 100vw;
				height: 100vh;
			}
			.diamond {
				--shoulder: 75%;
				--bevel: 17.5%;
				width: 25cqw;
				aspect-ratio: 1.25;
				background: steelblue;
				clip-path: polygon(50% 0, 100% var(--shoulder), calc(100% - var(--bevel)) 100%, var(--bevel) 100%, 0 var(--shoulder));
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="diamond"></div>
		</div>
	</body>
</html>
